<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../../assets/zoom-schutz.js"></script>
<title>SPIEL_TITEL</title>
<style>
/* Vorlage für ein neues Spiel: ein einfaches Quiz mit allem, was jedes Spiel braucht –
   Start-, Spiel- und Gewinn-Bildschirm, Link „Alle Spiele“ an allen drei Stellen, Fortschritt,
   freundliches Feedback, Sterne und Rekord, Speicherstand mit eigenem Schlüssel, große Knöpfe für Touch.
   Dazu gehört ein fertiger Durchspiel-Test (tools/vorlage/spieltest.js), den neues-spiel.js mit anlegt. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#16324f;
  background:linear-gradient(#69b9ee,#d6ecfb) fixed;display:flex;flex-direction:column;min-height:100%}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;color:inherit;
  text-decoration:none;box-shadow:0 3px 10px rgba(22,50,79,.2)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px 24px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:560px;width:100%;text-align:center;
  box-shadow:0 8px 24px rgba(22,50,79,.25)}
h1{margin:0 0 10px;font-size:clamp(26px,5vw,36px)}
p{font-size:18px;line-height:1.4;margin:10px 0}
.btn{display:block;width:100%;margin:10px 0 0;padding:14px 18px;min-height:52px;font:inherit;font-size:19px;font-weight:700;
  color:#16324f;background:#eef7fd;border:3px solid #b9dcf5;border-radius:16px;cursor:pointer;text-decoration:none}
.btn.main{background:#ff8a1f;border-color:#ff8a1f;color:#fff}
.btn.right{background:#d8f5d2;border-color:#4caf50}
.btn.wrong{background:#ffe0dc;border-color:#e57368}
.btn:focus-visible,.pill:focus-visible{outline:4px solid #16324f;outline-offset:2px}
#feedback{min-height:54px;font-weight:700}
#record,#winStars{font-weight:700}
#record:empty{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <a class="pill" href="../../">🏠 Alle Spiele</a>
  <span class="pill" id="stars"></span>
  <span class="pill" id="progress"></span>
</div>
<main>
  <section class="card" id="start">
    <h1>SPIEL_TITEL</h1>
    <p>TODO: Erkläre in zwei kurzen Sätzen, was zu tun ist.</p>
    <p id="record"></p>
    <button class="btn main" id="startBtn">▶ Los geht's!</button>
    <a class="btn" href="../../">🏠 Alle Spiele</a>
  </section>

  <section class="card" id="game" hidden>
    <h1 id="question"></h1>
    <div id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <button class="btn main" id="nextBtn" hidden>Weiter ➜</button>
  </section>

  <section class="card" id="win" hidden>
    <div style="font-size:70px">🏆</div>
    <h1>Geschafft!</h1>
    <p>Du hast alle Fragen gelöst. Super gemacht!</p>
    <p id="winStars"></p>
    <button class="btn main" id="againBtn">🔄 Nochmal spielen</button>
    <a class="btn" href="../../">🏠 Alle Spiele</a>
  </section>
</main>

<script>
(function () {
  /* Eigener Schlüssel für den Speicherstand – kein anderes Spiel darf denselben benutzen. */
  var SAVE = 'SPIEL_SCHLUESSEL';

  /* TODO: eigene Fragen. q = Frage, a = Antworten, r = Nummer der richtigen Antwort (ab 0),
     e = kurze Erklärung, die nach der richtigen Antwort erscheint. Die Antworten werden beim Anzeigen gemischt. */
  var QUESTIONS = [
    { q: 'Wie viele Tage hat eine Woche?', a: ['5', '7', '10'], r: 1, e: 'Eine Woche hat 7 Tage: von Montag bis Sonntag.' },
    { q: 'Welche Jahreszeit kommt nach dem Winter?', a: ['Frühling', 'Herbst', 'Sommer'], r: 0, e: 'Nach dem Winter kommt der Frühling. Dann blühen die ersten Blumen.' },
    { q: 'Was ist 6 · 4?', a: ['18', '24', '28'], r: 1, e: '6 · 4 = 24.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  /* Spielstand: index = aktuelle Frage, stars = Sterne in dieser Runde (richtig beim ersten Versuch),
     best = Rekord (meiste Sterne in einer Runde). */
  var state = load();
  var firstTry = true;

  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    s = s && typeof s === 'object' ? s : {};
    var num = function (v, max) { v = Math.floor(Number(v)); return v >= 0 && v <= max ? v : 0; };
    return { index: num(s.index, QUESTIONS.length - 1), stars: num(s.stars, QUESTIONS.length), best: num(s.best, QUESTIONS.length) };
  }
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(state)); } catch (e) {} }

  function show(screen) {
    ['start', 'game', 'win'].forEach(function (id) { $(id).hidden = id !== screen; });
    $('bar').hidden = screen !== 'game';
  }
  function showRecord() {
    $('record').textContent = state.best ? '🏅 Dein Rekord: ' + state.best + ' von ' + QUESTIONS.length + ' ⭐' : '';
  }

  function shuffled(list) {
    var out = list.slice();
    for (var i = out.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = out[i]; out[i] = out[j]; out[j] = t; }
    return out;
  }

  function ask() {
    if (state.index >= QUESTIONS.length) { finish(); return; }
    var item = QUESTIONS[state.index];
    firstTry = true;
    $('progress').textContent = 'Frage ' + (state.index + 1) + ' / ' + QUESTIONS.length;
    $('stars').textContent = '⭐ ' + state.stars;
    $('question').textContent = item.q;
    $('feedback').textContent = '';
    $('nextBtn').hidden = true;
    $('answers').innerHTML = '';
    shuffled(item.a.map(function (text, i) { return { text: text, right: i === item.r }; })).forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'btn';
      b.textContent = o.text;
      b.addEventListener('click', function () { answer(b, o.right, item); });
      $('answers').appendChild(b);
    });
    show('game');
  }

  function answer(button, correct, item) {
    if (correct) {
      button.classList.add('right');
      [].forEach.call($('answers').children, function (b) { b.disabled = true; });
      if (firstTry) { state.stars++; $('stars').textContent = '⭐ ' + state.stars; }
      $('feedback').textContent = '✅ Richtig! ' + item.e;
      $('nextBtn').hidden = false;
      $('nextBtn').focus();
    } else {
      firstTry = false;
      button.classList.add('wrong');
      button.disabled = true;
      $('feedback').textContent = '🤔 Noch nicht ganz. Versuch es noch einmal!';
    }
  }

  function finish() {
    var record = state.stars > state.best;
    if (record) state.best = state.stars;
    $('winStars').textContent = 'Du hast ' + state.stars + ' von ' + QUESTIONS.length + ' ⭐ gesammelt.' + (record ? ' Neuer Rekord! 🎉' : '');
    state.index = 0; state.stars = 0; save();
    showRecord();
    show('win');
  }

  $('startBtn').addEventListener('click', ask);
  $('nextBtn').addEventListener('click', function () { state.index++; save(); ask(); });
  $('againBtn').addEventListener('click', function () { state.index = 0; state.stars = 0; save(); ask(); });
  showRecord();

  /* Zugang für den Durchspiel-Test (tools/spieltests/<ordner>.js), nur mit ?test in der Adresse */
  if (/[?&]test\b/.test(location.search)) window.SPIEL = { QUESTIONS: QUESTIONS, SAVE: SAVE };
})();
</script>
</body>
</html>
